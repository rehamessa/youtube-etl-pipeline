# Soda connection to the ELT Postgres database.
# Values come from environment variables (set via .env / docker-compose).
# SCHEMA is dynamic: staging or core.
data_source pg_datasource:
  type: postgres
  host: ${POSTGRES_CONN_HOST}
  port: ${POSTGRES_CONN_PORT}
  username: ${ELT_DATABASE_USERNAME}
  password: ${ELT_DATABASE_PASSWORD}
  database: ${ELT_DATABASE_NAME}
  schema: ${SCHEMA}